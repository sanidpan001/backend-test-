<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixoraa Backend Test</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 50px auto;
    padding: 20px;
  }
  h1 { margin-bottom: 5px; }
  .row { display: flex; gap: 12px; margin: 20px 0; }
  button {
    padding: 14px 22px;
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    color: white;
  }
  #groqBtn { background: #4f46e5; }
  #geminiBtn { background: #16a34a; }
  pre {
    margin-top: 12px;
    padding: 20px;
    background: #111827;
    color: #fff;
    border-radius: 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
 
<h1>Fixoraa Backend Test</h1>
<p>Groq aur Gemini dono routes ek hi jagah test karo.</p>
 
<div class="row">
  <button id="groqBtn" onclick="testGroq()">Test Groq</button>
  <button id="geminiBtn" onclick="testGemini()">Test Gemini</button>
</div>
 
<pre id="output">Waiting...</pre>
 
<script>
  const BASE_URL = "https://fixoraa-universal-backend.onrender.com";
  const output = document.getElementById("output");
 
  async function testGroq() {
    output.textContent = "Groq se pooch raha hoon...";
    try {
      const res = await fetch(`${BASE_URL}/api/groq`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "openai/gpt-oss-20b",
          messages: [{ role: "user", content: "hello" }]
        })
      });
      const data = await res.json();
      output.textContent = "GROQ STATUS: " + res.status + "\n\n" + JSON.stringify(data, null, 2);
    } catch (err) {
      output.textContent = "GROQ FETCH ERROR:\n" + err;
    }
  }
 
  async function testGemini() {
    output.textContent = "Gemini se pooch raha hoon...";
    try {
      const res = await fetch(`${BASE_URL}/api/gemini`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: "hello" })
      });
      const data = await res.json();
      output.textContent = "GEMINI STATUS: " + res.status + "\n\n" + JSON.stringify(data, null, 2);
    } catch (err) {
      output.textContent = "GEMINI FETCH ERROR:\n" + err;
    }
  }
</script>
 
</body>
</html>
