<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend Debug Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    button {
      padding: 14px 22px;
      cursor: pointer;
      background: #4f46e5;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    pre {
      margin-top: 20px;
      padding: 20px;
      background: #111827;
      color: #fff;
      border-radius: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>Fixoraa Backend Test</h1>

  <p>Click the button to test your Groq backend.</p>

  <button onclick="testBackend()">
    Test Backend
  </button>

  <pre id="output">Waiting...</pre>

  <script>

    async function testBackend() {

      const output = document.getElementById("output");

      output.textContent = "Sending request...";

      try {

        const response = await fetch(
          "https://fixoraa-universal-backend.onrender.com/api/groq",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              model: "llama-3.1-8b-instant",

              messages: [
                {
                  role: "user",
                  content: "Say hello in one sentence."
                }
              ]
            })
          }
        );

        console.log("STATUS:", response.status);
        console.log("HEADERS:", response.headers);

        const raw = await response.text();

        console.log("RAW RESPONSE:", raw);

        output.textContent =
          "HTTP STATUS: " +
          response.status +
          "\n\nRESPONSE:\n" +
          raw;

      } catch (error) {

        console.error("FETCH ERROR:", error);

        output.textContent =
          "FETCH ERROR:\n\n" +
          error.message +
          "\n\nFULL ERROR:\n" +
          error;

      }

    }

  </script>

</body>
</html>
