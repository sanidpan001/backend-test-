<h1>Fixoraa Backend Test</h1>
<p>Groq aur Gemini dono routes ek hi jagah test karo.</p>
 
<div class="row">
  <button id="groqBtn" onclick="testGroq()">Test Groq</button>
  <button id="geminiBtn" onclick="testGemini()">Test Gemini</button>
</div>
 
<pre id="output">Waiting...</pre>
 
<script>
  const BASE_URL = "https://fixoraa-universal-backend.onrender.com";
  const output = document.getElementById("output");
 
  async function testGroq() {
    output.textContent = "Groq se pooch raha hoon...";
    try {
      const res = await fetch(`${BASE_URL}/api/groq`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "openai/gpt-oss-20b",
          messages: [{ role: "user", content: "hello" }]
        })
      });
      const data = await res.json();
      output.textContent = "GROQ STATUS: " + res.status + "\n\n" + JSON.stringify(data, null, 2);
    } catch (err) {
      output.textContent = "GROQ FETCH ERROR:\n" + err;
    }
  }
 
  async function testGemini() {
    output.textContent = "Gemini se pooch raha hoon...";
    try {
      const res = await fetch(`${BASE_URL}/api/gemini`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: "hello" })
      });
      const data = await res.json();
      output.textContent = "GEMINI STATUS: " + res.status + "\n\n" + JSON.stringify(data, null, 2);
    } catch (err) {
      output.textContent = "GEMINI FETCH ERROR:\n" + err;
    }
  }
</script>
